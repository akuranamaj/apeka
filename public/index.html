<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web2APK Panel</title>
<link rel="stylesheet" href="/public/css/style.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="brand-row">
        <div class="brand-mark"><i data-lucide="smartphone" class="icon"></i></div>
        <div>
          <div class="brand-name" data-brand-name>Web2APK</div>
          <div class="brand-sub" data-brand-title>Build APK dari URL atau project ZIP</div>
        </div>
      </div>
      <h1>Masuk ke panel</h1>
      <p class="lead">Kelola build, lihat antrian, dan pantau status langsung dari sini.</p>
      <a href="/login" class="btn-primary" style="display:block;text-align:center;text-decoration:none;">Login</a>
      <div class="auth-footer">
        Belum punya akun? <a href="/register" style="color:#949cf7;">Daftar</a>
      </div>
    </div>
  </div>
  <script src="/public/js/branding.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
