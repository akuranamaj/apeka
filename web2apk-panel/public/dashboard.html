<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Web2APK</title>
<link rel="stylesheet" href="/css/style.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="app-shell">
    <!-- Server rail -->
    <div class="server-rail">
      <div class="server-pill active" title="Web2APK">
        <i data-lucide="smartphone" class="icon"></i>
      </div>
      <div class="server-divider"></div>
      <div class="server-pill" title="Bantuan" id="helpPill">
        <i data-lucide="help-circle" class="icon"></i>
      </div>
    </div>

    <!-- Channel sidebar -->
    <div class="channel-sidebar">
      <div class="workspace-header" data-brand-name>Web2APK</div>
      <div class="channel-list">
        <div class="channel-group-label">Panel</div>
        <div class="channel-item active" data-view="overview">
          <i data-lucide="layout-dashboard" class="icon"></i> overview
        </div>
        <div class="channel-item" data-view="build">
          <i data-lucide="hammer" class="icon"></i> build-baru
        </div>
        <div class="channel-item" data-view="queue">
          <i data-lucide="list-ordered" class="icon"></i> antrian
        </div>
        <div class="channel-group-label" id="ownerGroupLabel" style="display:none;">Owner</div>
        <div class="channel-item" data-view="users" id="usersChannel" style="display:none;">
          <i data-lucide="users" class="icon"></i> daftar-user
        </div>
      </div>
      <div class="user-footer">
        <div class="avatar" id="avatarInitial">?</div>
        <div>
          <div class="name" id="userName">-</div>
          <div class="role" id="userRole">-</div>
        </div>
        <button class="icon-btn" id="logoutBtn" title="Keluar">
          <i data-lucide="log-out" class="icon" style="width:18px;height:18px;"></i>
        </button>
      </div>
    </div>

    <!-- Main content -->
    <div class="main-panel">
      <div class="main-header">
        <i data-lucide="hash" class="icon"></i>
        <h2 id="viewTitle">overview</h2>
      </div>
      <div class="main-content" id="mainContent">
        <!-- filled by dashboard.js -->
      </div>
    </div>
  </div>

  <script src="/js/branding.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
